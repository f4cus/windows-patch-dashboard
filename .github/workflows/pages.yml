name: Refresh reports and deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      month:
        description: Optional report month (YYYY-MM); defaults to the latest enabled Patch Tuesday
        required: false
        type: string
  schedule:
    # UTC candidates; the plan job enables only approved ART slots.
    - cron: "0 18 * * *"
    - cron: "15 17-23 * * 2"
    - cron: "15 0,1 * * 3"
    - cron: "0 12,14,16,20,22 * * 3"
    - cron: "0 12,16,20 * * 4"
    - cron: "0 0 * * 4,5"
    - cron: "0 12 * * 5"

permissions: {}

jobs:
  plan:
    name: Check refresh window
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      month: ${{ steps.plan.outputs.month }}
      report_path: ${{ steps.plan.outputs.report_path }}
    steps:
      - name: Check out scheduling rules
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Determine enabled refresh and target month
        id: plan
        shell: bash
        env:
          PYTHONPATH: collector/src
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MONTH: ${{ inputs.month }}
          GH_TOKEN: ${{ github.token }}
          RUN_API_URL: ${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          args=(--event "$EVENT_NAME" --schedule "$EVENT_SCHEDULE")
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            created_at="$(curl --fail --silent --show-error --retry 2 --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" "$RUN_API_URL" | jq -er '.created_at')"
            args+=(--at "$created_at")
          fi
          if [[ -n "$REQUESTED_MONTH" ]]; then
            args+=(--month "$REQUESTED_MONTH")
          fi
          python3 -m windows_patch_collector.refresh_schedule "${args[@]}" >> "$GITHUB_OUTPUT"

  refresh:
    name: Refresh Microsoft report
    needs: plan
    if: needs.plan.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: report-refresh-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      commit_sha: ${{ steps.state.outputs.commit_sha }}
    steps:
      - name: Check out default branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/pyproject.toml

      - name: Install collector
        run: python -m pip install -e collector

      - name: Preserve committed report for comparison
        shell: bash
        env:
          REPORT_PATH: ${{ needs.plan.outputs.report_path }}
        run: |
          if [[ -f "$REPORT_PATH" ]]; then
            cp -- "$REPORT_PATH" "$RUNNER_TEMP/committed-report.json"
          fi

      - name: Collect official Microsoft data
        run: python -m windows_patch_collector collect --month "${{ needs.plan.outputs.month }}"

      - name: Validate generated repository data
        run: python -m windows_patch_collector validate

      - name: Detect meaningful report changes
        id: comparison
        shell: bash
        run: |
          changed="$(python -m windows_patch_collector reconcile-report \
            --month "${{ needs.plan.outputs.month }}" \
            --baseline "$RUNNER_TEMP/committed-report.json" --require-release)"
          if [[ "$changed" != "true" && "$changed" != "false" ]]; then
            echo "Unexpected comparison result: $changed" >&2
            exit 1
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit substantive report update
        if: steps.comparison.outputs.changed == 'true'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPORT_MONTH: ${{ needs.plan.outputs.month }}
          REPORT_PATH: ${{ needs.plan.outputs.report_path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$REPORT_PATH"
          if git diff --cached --quiet; then
            echo "Semantic comparison reported a change, but no report change was staged." >&2
            exit 1
          fi
          git commit -m "data: refresh Microsoft updates for $REPORT_MONTH"
          git push origin "HEAD:$DEFAULT_BRANCH"

      - name: Record exact state for build
        id: state
        shell: bash
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Validate and build Pages artifact
    needs: refresh
    if: >-
      ${{ always() &&
          (github.event_name == 'push' || needs.refresh.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out deployable state
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event_name == 'push' && github.sha || needs.refresh.outputs.commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/pyproject.toml

      - name: Install collector
        run: python -m pip install -e collector

      - name: Validate deployable repository data
        run: python -m windows_patch_collector validate

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build frontend for GitHub Pages
        run: npm run build
        working-directory: frontend
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: frontend/dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
